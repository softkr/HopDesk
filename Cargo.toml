[package]
name = "hopdesk"
version = "0.1.0"
edition = "2024"
description = "HopDesk: RDP desktop client connecting through an SSH jump host"
publish = false

[dependencies]
# RDP engine + winit/softbuffer viewer: IronRDP HEAD (d5e70f0) with a small custom-transport
# patch, see third_party/PATCHES.md
ironrdp-client = { path = "third_party/IronRDP/crates/ironrdp-client", features = ["rustls"] }
ironrdp-viewer = { path = "third_party/IronRDP/crates/ironrdp-viewer" }
ironrdp-pdu = { path = "third_party/IronRDP/crates/ironrdp-pdu" }
ironrdp-tls = { path = "third_party/IronRDP/crates/ironrdp-tls", features = ["rustls"] }
# Shared folder (drive redirection)
ironrdp-rdpdr-native = { path = "third_party/IronRDP/crates/ironrdp-rdpdr-native" }

# SSH jump host
russh = "0.65"

# Window
winit = { version = "0.30", features = ["rwh_06"] }

# Profiles & secrets
keyring = "4"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
rpassword = "7"
whoami = "2.1"

# Runtime, CLI, logging
tokio = { version = "1", features = ["full"] }
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = "0.37"
rfd = "0.18"

# Session Dock icon and badge, clipboard bridge (the engine has no macOS clipboard backend)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSEvent", "NSImage", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSScreen"] }
ironrdp-cliprdr = { path = "third_party/IronRDP/crates/ironrdp-cliprdr" }
ironrdp-core = { path = "third_party/IronRDP/crates/ironrdp-core" }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.26"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
egui_system_font_provider = "0.37"
