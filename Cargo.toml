[package]
name = "hopdesk"
version = "0.3.0"
edition = "2024"
description = "HopDesk: RDP desktop client connecting through an SSH jump host"
publish = false

[dependencies]
# RDP engine + winit/softbuffer viewer: IronRDP HEAD (d5e70f0) with a small custom-transport
# patch, see third_party/PATCHES.md
ironrdp-client = { path = "third_party/IronRDP/crates/ironrdp-client", features = ["rustls"] }
ironrdp-viewer = { path = "third_party/IronRDP/crates/ironrdp-viewer" }
ironrdp-pdu = { path = "third_party/IronRDP/crates/ironrdp-pdu" }
ironrdp-tls = { path = "third_party/IronRDP/crates/ironrdp-tls", features = ["rustls"] }
# Shared folder (drive redirection)
ironrdp-rdpdr-native = { path = "third_party/IronRDP/crates/ironrdp-rdpdr-native" }

# SSH jump host and SSH sessions
russh = "0.65"
# Userspace WireGuard VPN: the protocol (no TUN device, no root) and the TCP/IP stack on top of it
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }
base64 = "0.22"
# Terminal emulation for SSH sessions (rendered with egui)
alacritty_terminal = { version = "0.26", default-features = false }
# VNC sessions (RFB client, incl. macOS account login)
# patch, see third_party/PATCHES.md
vnc-rs = { path = "third_party/vnc-rs" }

# Window
winit = { version = "0.30", features = ["rwh_06"] }

# Profiles & secrets
keyring = "4"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
rpassword = "7"
whoami = "2.1"

# Runtime, CLI, logging
tokio = { version = "1", features = ["full"] }
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = "0.37"
# Lucide SVG icons, rasterized by resvg at the exact pixel size
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
rfd = "0.18"

# AI co-worker: screenshots for the model (already in the tree through eframe), the model's API
# (system root certificates, so TLS-inspecting company proxies work), AI input for RDP sessions,
# and text in the session overlay (already in the tree through egui).
# reqwest brings no crypto provider: with a second one next to IronRDP's aws-lc-rs, rustls cannot
# pick a process default and every RDP connection panics.
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots-no-provider", "http2", "system-proxy", "json"] }
# Checking the address of an AI server (already in the tree through reqwest)
url = "2"
# The process-wide crypto provider reqwest needs installed (aws-lc-rs, as IronRDP's TLS uses)
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
ironrdp-input = { path = "third_party/IronRDP/crates/ironrdp-input" }
ab_glyph = "0.2"

# Session Dock icon and badge, reopening the launcher from the Dock, clipboard bridge (the engine has no macOS clipboard backend), Reduce Motion setting
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSDockTile", "NSEvent", "NSImage", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSScreen", "NSWorkspace"] }
ironrdp-cliprdr = { path = "third_party/IronRDP/crates/ironrdp-cliprdr" }
ironrdp-core = { path = "third_party/IronRDP/crates/ironrdp-core" }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventManager", "NSArray", "NSData", "NSGeometry", "NSString", "NSURL"] }
# A stopped session leaves the Dock before it exits: SIGTERM from the launcher, the Dock change on the main thread
libc = "0.2"
dispatch2 = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.26"

[dev-dependencies]
# Paused time in the agent loop tests
tokio = { version = "1", features = ["test-util"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
egui_system_font_provider = "0.37"
