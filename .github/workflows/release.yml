# Builds HopDesk for macOS, Windows and Linux.
#
# - Push to `main`: builds all platforms and publishes a GitHub release tagged
#   with the next patch version (see the `version` job).
# - Run manually (Actions > Release > Run workflow): builds only; packages are
#   attached to the workflow run as artifacts.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two quick pushes never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Cargo.toml sets major.minor and the lowest patch; each release takes the
      # next patch after the highest existing `v<major>.<minor>.*` tag.
      - id: next
        shell: bash
        run: |
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          IFS=. read -r major minor patch <<< "${base%%-*}"
          latest=$(git tag --list "v$major.$minor.*" \
            | sed -n "s/^v$major\.$minor\.\([0-9][0-9]*\)$/\1/p" \
            | sort -n | tail -n 1)
          if [ -n "$latest" ] && [ "$latest" -ge "$patch" ]; then
            patch=$((latest + 1))
          fi
          version="$major.$minor.$patch"
          echo "Release version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon, Intel)
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            targets: ""
          # Oldest supported runner, so the binary runs on older glibc versions too.
          - name: Linux (x64)
            os: ubuntu-22.04
            targets: ""

    steps:
      - uses: actions/checkout@v4

      # Stamp the release version into the build only; nothing is committed back.
      - name: Set version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: perl -0pi -e 's/^version = ".*?"/version = "$ENV{VERSION}"/m' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libasound2-dev libfontconfig1-dev libxkbcommon-dev \
            libwayland-dev libudev-dev libdrm-dev

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # One disk image per architecture, so Intel and Apple Silicon downloads are explicit.
        run: |
          scripts/release-macos.sh --target aarch64-apple-darwin
          scripts/release-macos.sh --target x86_64-apple-darwin

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # aws-lc-sys: use its bundled assembly objects instead of requiring NASM.
          AWS_LC_SYS_PREBUILT_NASM: "1"
        run: scripts/release-windows.ps1

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: scripts/release-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hopdesk-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > notes.md
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "HopDesk $VERSION" \
            --notes-file notes.md
