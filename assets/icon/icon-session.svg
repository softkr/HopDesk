<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<title>HopDesk session</title>
<!-- icon.svg with the colors swapped: gradient monitor on a navy tile. -->
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E3A66"/><stop offset="1" stop-color="#0E1F3A"/></linearGradient>
 <linearGradient id="gApp" gradientUnits="userSpaceOnUse" x1="92" y1="120" x2="420" y2="386"><stop offset="0" stop-color="#8EF0D2"/><stop offset="1" stop-color="#7FB4E6"/></linearGradient>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B1F28" flood-opacity="0.28"/></filter>
</defs>
<g filter="url(#sh)">
 <g transform="translate(100 100) scale(1.609375)">
