   <path fill-rule="evenodd" d="M110,120 H402 Q420,120 420,138 V318 Q420,336 402,336 H110 Q92,336 92,318 V138 Q92,120 110,120 Z M116,144 V292 H396 V144 Z"/>
   <path d="M236,334 H276 L284,370 H228 Z"/>
